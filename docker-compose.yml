services:
  postgres:
    image: postgres:18.3
    container_name: vibecheck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibecheck
      POSTGRES_USER: vibecheck
      POSTGRES_PASSWORD: vibecheck
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecheck -d vibecheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.2
    container_name: vibecheck-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: BROKER://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibecheck-app:latest
    container_name: vibecheck-api
    restart: unless-stopped
    working_dir: /app
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://vibecheck:vibecheck@postgres:5432/vibecheck
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_POLL_INTERVAL_SECONDS: ${YOUTUBE_POLL_INTERVAL_SECONDS:-5}
      LIVE_FEED_POLL_INTERVAL_SECONDS: ${LIVE_FEED_POLL_INTERVAL_SECONDS:-0.25}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  processor:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibecheck-app:latest
    container_name: vibecheck-processor
    restart: unless-stopped
    working_dir: /app
    command: python -m processor.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://vibecheck:vibecheck@postgres:5432/vibecheck
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - .:/app

  youtube-ingestor:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibecheck-app:latest
    container_name: vibecheck-youtube-ingestor
    restart: unless-stopped
    working_dir: /app
    command: python -m youtube_ingestor.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://vibecheck:vibecheck@postgres:5432/vibecheck
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_POLL_INTERVAL_SECONDS: ${YOUTUBE_POLL_INTERVAL_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - .:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vibecheck-frontend:latest
    container_name: vibecheck-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
  kafka_data:
